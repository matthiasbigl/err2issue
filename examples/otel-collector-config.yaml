# OTel Collector configuration for err2issue.
#
# The point of this file is what it does NOT change: your existing pipeline to
# your existing backend is untouched. err2issue is added as a *second* exporter
# fed by a filtered copy of the log stream, so applications never learn it
# exists and removing it is a one-line revert.
#
# Copy the marked sections into your own collector config.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    # Small batches keep filing latency low; errors are low-volume by nature.
    timeout: 5s
    send_batch_size: 64

  # >>> ADD THIS <<<
  # Keep only records that are actually errors. Everything else never leaves
  # the collector, so err2issue sees a tiny fraction of your log volume.
  #
  # OTel severity numbers: 17-20 = ERROR, 21-24 = FATAL.
  # The second clause catches handled-and-logged exceptions that were recorded
  # at a lower severity but still carry exception semantic-convention
  # attributes — those are real errors worth filing.
  filter/errors_only:
    error_mode: ignore
    logs:
      log_record:
        - 'severity_number < SEVERITY_NUMBER_ERROR and attributes["exception.type"] == nil'

  # >>> OPTIONAL <<<
  # err2issue needs service.name to route. If your resource detection does not
  # always set it, uncomment this to guarantee a value rather than having
  # errors land in the fallback repository.
  # transform/ensure_service_name:
  #   error_mode: ignore
  #   log_statements:
  #     - context: resource
  #       statements:
  #         - set(attributes["service.name"], "unknown-service")
  #           where attributes["service.name"] == nil

exporters:
  # Your existing backend. Replace with whatever you already run — this entry
  # is here only to show that it stays exactly as it was.
  debug:
    verbosity: basic

  # >>> ADD THIS <<<
  otlphttp/err2issue:
    endpoint: http://err2issue:4318
    encoding: json          # `proto` also works; err2issue accepts both
    compression: gzip
    tls:
      insecure: true        # in-cluster plaintext; use TLS across a network
    retry_on_failure:
      # This queue is what makes err2issue safe to restart, redeploy, or lose:
      # the collector holds the errors and replays them.
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 1000

service:
  pipelines:
    # Your existing pipeline — unchanged.
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

    # >>> ADD THIS <<<
    # A separate pipeline so the filter cannot affect what reaches your backend.
    logs/err2issue:
      receivers: [otlp]
      processors: [filter/errors_only, batch]
      exporters: [otlphttp/err2issue]

  telemetry:
    logs:
      level: info
